<!-- Same as the last problem but align the "Hello World" text to the center of the page 
vertically and horizontally.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical-align</title>
    <style>
        .main {
            background-color: yellow;
            width: 1200px;
            height: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        };
    </style>
</head>
<body>
    <div class="main">
        <span><h1>Hello world</h1></span>
    </div>
</body>
</html>
